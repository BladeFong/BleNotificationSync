name: "Publish Release"

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            args: ""
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "macos-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: |
          cd desktop
          npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "BLE Notification Sync ${{ github.ref_name }}"
          releaseBody: "BLE Notification Sync ${{ github.ref_name }} has been compiled and released successfully."
          releaseDraft: false
          prerelease: false
          projectPath: "desktop"
          includeRelease: true
          includeDebug: false

  publish-android:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Android Demo & SDK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :demo:assembleDebug :sdk:bundleReleaseAar

      - name: Prepare release files
        run: |
          mv examples/android-demo/build/outputs/apk/debug/demo-debug.apk examples/android-demo/build/outputs/apk/debug/ble-notification-demo.apk
          mv android/sdk/build/outputs/aar/sdk-release.aar android/sdk/build/outputs/aar/ble-notification-sdk.aar

      - name: Wait for release to be created
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          for i in {1..20}; do
            if gh release view ${{ github.ref_name }} > /dev/null 2>&1; then
              echo "Release found."
              break
            fi
            echo "Waiting for release... ($i/20)"
            sleep 30
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Android assets to Release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          gh release upload ${{ github.ref_name }} \
            examples/android-demo/build/outputs/apk/debug/ble-notification-demo.apk \
            android/sdk/build/outputs/aar/ble-notification-sdk.aar \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}


