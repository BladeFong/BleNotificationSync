name: "Publish Release"

on:
  push:
    tags:
      - "v*"
    branches-ignore:
      - "**"
  workflow_dispatch:
    inputs:
      tag_name:
        description: '上传到的 Release Tag（如 v0.1.0）'
        type: string
        required: true
      build_windows:
        description: '编译 Windows'
        type: boolean
        default: true
      build_linux:
        description: '编译 Linux'
        type: boolean
        default: true
      build_macos:
        description: '编译 macOS'
        type: boolean
        default: true
      build_android:
        description: '编译 Android (APK + AAR)'
        type: boolean
        default: true


permissions:
  contents: write

jobs:
  publish-tauri:
    permissions:
      contents: write
    if: |
      github.event_name == 'push' ||
      (matrix.platform == 'windows-latest' && inputs.build_windows) ||
      (matrix.platform == 'ubuntu-22.04' && inputs.build_linux) ||
      (matrix.platform == 'macos-latest' && inputs.build_macos)
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            args: ""
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "macos-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    env:
      TAG_NAME: ${{ github.event_name == 'push' && github.ref_name || inputs.tag_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: |
          cd desktop
          npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.TAG_NAME }}
          releaseName: "BLE Notification Sync ${{ env.TAG_NAME }}"
          releaseBody: "BLE Notification Sync ${{ env.TAG_NAME }} has been compiled and released successfully."
          releaseDraft: false
          prerelease: false
          projectPath: "desktop"
          includeRelease: true
          includeDebug: false

  publish-android:
    if: github.event_name == 'push' || inputs.build_android
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ github.event_name == 'push' && github.ref_name || inputs.tag_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Android Demo & SDK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :demo:assembleDebug :sdk:bundleReleaseAar

      - name: Prepare release files
        run: |
          mv examples/android-demo/build/outputs/apk/debug/demo-debug.apk examples/android-demo/build/outputs/apk/debug/ble-notification-demo.apk
          mv android/sdk/build/outputs/aar/sdk-release.aar android/sdk/build/outputs/aar/ble-notification-sdk.aar

      - name: Wait for release to be created
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: |
          for i in {1..20}; do
            if gh release view ${{ env.TAG_NAME }} > /dev/null 2>&1; then
              echo "Release found."
              break
            fi
            echo "Waiting for release... ($i/20)"
            sleep 30
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Android assets to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: |
          gh release upload ${{ env.TAG_NAME }} \
            examples/android-demo/build/outputs/apk/debug/ble-notification-demo.apk \
            android/sdk/build/outputs/aar/ble-notification-sdk.aar \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}


