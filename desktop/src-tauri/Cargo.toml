[package]
name = "ble-notification-sync"
version = "0.1.0"
description = "BLE Notification Sync - Sync phone notifications to PC via Bluetooth"
authors = ["you"]
edition = "2021"

[lib]
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

tauri-plugin-notification = "2"
notify-rust = "4"

# BLE Peripheral (cross-platform: Windows/macOS/Linux)
ble-peripheral-rust = "0.2"
uuid = "1"

# BLE scanning for pairing (cross-platform)
btleplug = "0.11"

# Crypto
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
hex = "0.4"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Time
chrono = "0.4"

# Secure credential storage (cross-platform: Windows Credential Manager / macOS Keychain / Linux Secret Service)
keyring = "4"

[target.'cfg(target_os = "windows")'.dependencies]
winrt-notification = "0.5"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
